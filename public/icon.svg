<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#6D1028" />
      <stop offset="50%" stop-color="#3B0A18" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#922D48" />
      <stop offset="50%" stop-color="#6D1028" />
      <stop offset="100%" stop-color="#30262B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F0F1" />
      <stop offset="100%" stop-color="#AAA2A7" />
    </linearGradient>
  </defs>
  
  <!-- Outer Background -->
  <rect width="512" height="512" rx="104" fill="#0B0B0D" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="url(#bgGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.8" />
  
  <!-- Geometric Crest Pattern -->
  <g transform="translate(256, 210)">
    <!-- Outer Octagonal Ring -->
    <polygon points="0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0 -85,-85" fill="none" stroke="#922D48" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
    <!-- Inner Octagon -->
    <polygon points="0,-95 67,-67 95,0 67,67 0,95 -67,67 -95,0 -67,-67" fill="#151316" stroke="#6D1028" stroke-width="3" />
    
    <!-- Stylized Wings/Flame Ascending Icon -->
    <path d="M0 -75 L28 -20 L15 35 L0 20 L-15 35 L-28 -20 Z" fill="#6D1028" stroke="#922D48" stroke-width="2" />
    <path d="M0 -60 L16 -15 L8 20 L0 10 L-8 20 L-16 -15 Z" fill="#922D48" />
    
    <!-- Center Core Glow -->
    <circle cx="0" cy="-10" r="14" fill="#F4F0F1" opacity="0.9" />
    <circle cx="0" cy="-10" r="6" fill="#6D1028" />
  </g>
  
  <!-- Monogram & Typography -->
  <text x="256" y="380" font-family="'Cairo', sans-serif" font-size="46" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">ABSKA</text>
  <text x="256" y="425" font-family="'Cairo', sans-serif" font-size="22" font-weight="700" fill="#922D48" text-anchor="middle" letter-spacing="4">214 DAYS</text>
  <text x="256" y="455" font-family="'Cairo', sans-serif" font-size="14" font-weight="500" fill="#AAA2A7" text-anchor="middle">التحوّل الشامل</text>
</svg>
